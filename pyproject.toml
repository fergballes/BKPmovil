[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bkpmovil"
version = "0.1.0"
description = "Copia de seguridad de móviles Android por WiFi mediante ADB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fernando", email = "43673324+fergballes@users.noreply.github.com" }]
dependencies = ["PySide6-Essentials>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.6"]

[project.scripts]
bkpmovil = "bkpmovil.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bkpmovil"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selección explícita para que el resultado no dependa de la configuración
# global de cada máquina.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF100"]
ignore = [
    "E501",    # el formato de las guías necesita líneas largas puntuales
    "B008",    # llamadas en valores por defecto: no se usan aquí de forma peligrosa
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tools/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["device: requiere un dispositivo Android conectado por ADB"]
