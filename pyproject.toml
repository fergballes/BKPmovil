[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bkpmovil"
version = "0.1.0"
description = "Copia de seguridad de móviles Android por WiFi mediante ADB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fernando", email = "43673324+fergballes@users.noreply.github.com" }]
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.5"]

[project.scripts]
bkpmovil = "bkpmovil.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bkpmovil"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: requiere un dispositivo Android conectado por ADB"]
