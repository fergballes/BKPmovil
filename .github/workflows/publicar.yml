name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a construir (por ejemplo 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  construir:
    name: Construir para ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: Linux
          - os: windows-latest
            nombre: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Calcular la versión
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "valor=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Fijar la versión en el código
        shell: bash
        run: |
          V="${{ steps.version.outputs.valor }}"
          python - "$V" <<'PY'
          import re, sys, pathlib
          version = sys.argv[1]
          init = pathlib.Path("src/bkpmovil/__init__.py")
          init.write_text(f'__version__ = "{version}"\n', encoding="utf-8")
          pyproject = pathlib.Path("pyproject.toml")
          texto = pyproject.read_text(encoding="utf-8")
          pyproject.write_text(
              re.sub(r'^version = ".*"$', f'version = "{version}"', texto, count=1, flags=re.M),
              encoding="utf-8",
          )
          PY

      - name: Dependencias de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libxcb-cursor0

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Pruebas antes de publicar
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Construir el paquete
        run: python tools/build.py

      - name: Crear el instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMiVersion=${{ steps.version.outputs.valor }}" packaging\windows\BKPmovil.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ha fallado" }

      - name: Guardar los resultados
        uses: actions/upload-artifact@v4
        with:
          name: bkpmovil-${{ matrix.nombre }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*instalador.exe
          if-no-files-found: error

  publicar:
    name: Publicar la versión
    needs: construir
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true

      - name: Listar lo que se va a publicar
        run: ls -lah paquetes

      - name: Crear la publicación en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*
          generate_release_notes: true
          body: |
            ## Cómo instalar

            **Windows** — descarga `BKPmovil-…-instalador.exe`, ábrelo y deja
            marcada la casilla del acceso directo en el Escritorio. Si Windows
            avisa de que no está firmado: *Más información* → *Ejecutar de todas
            formas*. Si prefieres no instalar nada, usa el `.zip` y ejecuta
            `BKPmovil.exe` directamente.

            **Linux** — descarga el `.tar.gz`, descomprímelo y ejecuta
            `./instalar.sh` dentro de la carpeta. Deja la aplicación en el menú
            y crea el acceso directo en el Escritorio.

            Ambos paquetes llevan `adb` dentro: no hace falta instalar nada más.

            Consulta `LEEME.txt` para los pasos de uso, o el
            [manual completo](https://github.com/${{ github.repository }}/blob/main/docs/GUIA.md).
